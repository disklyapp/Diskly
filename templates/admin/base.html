<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}?v=1.1">
    <style>
        .sidebar-section-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888888;
            padding: 8px 0 4px 5px;
            margin-top: 15px;
            margin-bottom: 5px;
            list-style: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar-nav-item .nav-link {
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        .sidebar-nav-item .nav-link:hover {
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary-accent) !important;
        }
    </style>
</head>

<body>

<!-- TOP HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-4">
    
    <!-- Left Logo -->
    <div class="d-flex align-items-center gap-2">
        <button class="btn d-lg-none text-white p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" style="border:none; background:transparent;">
            <i class="fa-solid fa-bars fs-4"></i>
        </button>
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2 m-0" href="/">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Diskly Logo" style="height: 32px;">
            <span>Disk<span class="text-highlight">ly</span></span>
        </a>
    </div>

    <!-- Right Menu -->
    <div class="d-flex align-items-center gap-3">
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
        <!-- Desktop Nav -->
        <div class="d-none d-lg-flex align-items-center gap-3">
            <a href="/admin/logout" class="btn btn-sm btn-danger px-3">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </a>
        </div>
</nav>


<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="offcanvas-lg offcanvas-start bg-dark text-white border-end border-secondary"
         tabindex="-1" id="sidebarMenu" style="width:250px; min-height:100vh;">

         <div class="offcanvas-header d-lg-none border-bottom border-secondary mb-3">
             <h5 class="offcanvas-title fw-bold" style="color: var(--text-color);">Menu</h5>
             <button type="button" class="btn-close" style="filter: invert(1);" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
         </div>

          <div class="offcanvas-body p-3 pt-0 pt-lg-3 flex-column">
            <ul class="nav flex-column w-100">

                <!-- GENERAL SECTION -->
                <li class="sidebar-section-header m-0" style="margin-top: 0px !important;">General</li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/dashboard" class="nav-link text-white">
                        <i class="fa-solid fa-chart-pie me-2 text-light"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/analytics" class="nav-link text-white">
                        <i class="fa-solid fa-chart-line me-2 text-info"></i>
                        Analytics
                    </a>
                </li>

                <!-- CONTENT SECTION -->
                <li class="sidebar-section-header">Content</li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/upload" class="nav-link text-white">
                        <i class="fa-solid fa-cloud-arrow-up me-2 text-success"></i>
                        Upload Video
                    </a>
                </li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/videos" class="nav-link text-white">
                        <i class="fa-solid fa-film me-2 text-primary"></i>
                        All Videos
                    </a>
                </li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/telegram" class="nav-link text-white">
                        <i class="fa-brands fa-telegram me-2 text-info"></i>
                        Telegram Bot
                    </a>
                </li>

                <!-- PAYOUTS & SETTINGS SECTION -->
                <li class="sidebar-section-header">Payouts</li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/billing" class="nav-link text-white">
                        <i class="fa-solid fa-credit-card me-2 text-primary-green"></i>
                        Billing & Payout
                    </a>
                </li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/account" class="nav-link text-white">
                        <i class="fa-solid fa-user me-2 text-warning"></i>
                        Account
                    </a>
                </li>
                <li class="nav-item sidebar-nav-item py-1">
                    <a href="/admin/support" class="nav-link text-white">
                        <i class="fa-solid fa-headset me-2 text-info"></i>
                        Support
                    </a>
                </li>

                <li class="nav-item sidebar-nav-item py-1 border-top border-secondary pt-3 mt-3">
                    <a href="/admin/logout" class="nav-link text-white">
                        <i class="fa-solid fa-right-from-bracket me-2 text-danger"></i>
                        Logout
                    </a>
                </li>

            </ul>
          </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="p-4 w-100" style="overflow-x: hidden; max-width: 100vw;">
        {% block content %}{% endblock %}
    </div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
