{% extends "my_base.html" %}

{% block title %}404 - Page Not Found - Diskly{% endblock %}

{% block content %}
<style>
    .not-found-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 40px;
        width: 100%;
        max-width: 460px;
        text-align: center;
        box-shadow: var(--card-shadow);
        position: relative;
        overflow: hidden;
    }

    .glass-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #ef4444, #f59e0b);
    }

    .icon-wrapper-404 {
        background: rgba(239, 68, 68, 0.1);
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .icon-wrapper-404 i {
        font-size: 36px;
        color: #ef4444;
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
    }

    .status-badge {
        display: inline-block;
        padding: 4px 14px;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1.5px;
        border-radius: 20px;
        margin-bottom: 12px;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .error-title {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 10px;
    }

    .error-desc {
        color: var(--text-muted);
        font-size: 15px;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .btn-home {
        background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
        color: #000 !important;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        font-size: 16px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }

    .btn-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
        color: #000 !important;
    }

    .divider {
        display: flex;
        align-items: center;
        margin: 25px 0;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--glass-border);
    }

    .divider span {
        padding: 0 15px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .btn-secondary-link {
        background: var(--nav-bg);
        color: var(--text-color) !important;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 500;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-secondary-link:hover {
        background: var(--glass-bg);
        border-color: var(--primary-accent);
        transform: translateY(-2px);
    }
</style>

<div class="container not-found-container mt-5">
    <div class="glass-card">
        <div class="icon-wrapper-404">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div class="status-badge">404 ERROR</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The link you followed doesn't exist, has been removed, or is not a valid video link.</p>

        <a href="/" class="btn-home">
            <i class="fa-solid fa-house"></i> Go to Homepage
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="/app" class="btn-secondary-link">
            <i class="fa-brands fa-google-play"></i> Download Diskly App
        </a>
    </div>
</div>
{% endblock %}
